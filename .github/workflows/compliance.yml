name: Compliance

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Plumber
      uses: outscale/.github/pipeline-compliance@2806dfed40e08ccd51bee7edcac524fd02a67f06 # v1.3.0
      with:
        plumber-threshold: 100
        github-token: ${{ secrets.PLUMBER_TOKEN }}
